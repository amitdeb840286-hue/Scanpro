name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Unzip project
        run: unzip -q "scanpro_step1_2 (1).zip"
      - name: Fix localization getter
        working-directory: scanpro
        run:         run: |
          echo "nullable-getter: false" >> l10n.yaml
      - name: Create platform folders
        working-directory: scanpro
        run: flutter create --org com.example --project-name scanpro .
      - name: Patch Android
        working-directory: scanpro
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: Build
        working-directory: scanpro
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: scanpro-apk
          path: scanpro/build/app/outputs/flutter-apk/*.apk
